# Production Configuration
spring.application.name=WeatherAlertSystem
server.port=8080

# MongoDB Production Configuration
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=weather_alert_db

# Redis Production Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=60000ms
spring.cache.type=redis

# External API Configuration
weather.api.key=${WEATHER_API_KEY}
weather.api.base-url=https://api.openweathermap.org/data/2.5

# Twilio Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}

# Mailgun Configuration
mailgun.api-key=${MAILGUN_API_KEY}
mailgun.domain=${MAILGUN_DOMAIN}
mailgun.base-url=https://api.mailgun.net/v3

# Scheduling Configuration
weather.alert.schedule.fixed-rate=300000
weather.alert.schedule.initial-delay=60000

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD}

# Logging
logging.level.com.weather.alert=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
