# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Application Configuration
spring.application.name=WeatherAlertSystem
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/weather_alert_db}
spring.data.mongodb.database=weather_alert_db

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000ms
spring.cache.type=redis

# External API Configuration
weather.api.key=${WEATHER_API_KEY:your_weather_api_key}
weather.api.base-url=https://api.openweathermap.org/data/2.5

# Twilio Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID:your_twilio_sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your_twilio_token}
twilio.phone-number=${TWILIO_PHONE_NUMBER:your_twilio_phone}

# Mailgun Configuration
mailgun.api-key=${MAILGUN_API_KEY:your_mailgun_key}
mailgun.domain=${MAILGUN_DOMAIN:your_mailgun_domain}
mailgun.base-url=https://api.mailgun.net/v3

# Scheduling Configuration
weather.alert.schedule.fixed-rate=300000
weather.alert.schedule.initial-delay=60000

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Logging
logging.level.com.weather.alert=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.weather.alert.system=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
