# Test Configuration
spring.application.name=WeatherAlertSystemTest
server.port=0

# Embedded MongoDB for testing
spring.data.mongodb.host=localhost
spring.data.mongodb.port=0
spring.data.mongodb.database=weather_alert_test_db

# Embedded Redis for testing
spring.data.redis.host=localhost
spring.data.redis.port=0
spring.cache.type=redis

# Disable external services in tests
weather.api.key=test-api-key
weather.api.base-url=http://localhost:8089

twilio.account-sid=test-sid
twilio.auth-token=test-token
twilio.phone-number=+1234567890

mailgun.api-key=test-key
mailgun.domain=test.mailgun.org
mailgun.base-url=http://localhost:8089

# Test scheduling (disabled for unit tests)
weather.alert.schedule.fixed-rate=999999999
weather.alert.schedule.initial-delay=999999999

# Logging configuration to avoid conflicts
logging.level.com.weather.alert=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.mongodb.driver=WARN
logging.level.redis.clients.jedis=WARN
